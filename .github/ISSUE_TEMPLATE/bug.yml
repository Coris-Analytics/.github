name: Bug
description: Something is broken or wrong.
type: Bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: App version, build number or commit SHA.
  - type: textarea
    id: context
    attributes:
      label: Device, logs or screenshots
      description: Never paste real receipts, card numbers or other personal data.
